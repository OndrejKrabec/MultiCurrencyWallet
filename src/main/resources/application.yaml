spring:
  application:
    name: multicurrency-wallet

wallet:
  cnb:
    base-url: https://api.cnb.cz
    connect-timeout: 2s
    read-timeout: 3s
    # how often the background refresh checks whether a newer fixing can exist (and then calls CNB)
    refresh-interval: 10m

management:
  endpoint:
    health:
      # the cnb component shows the fixing date and whether the last refresh failed
      show-details: always
