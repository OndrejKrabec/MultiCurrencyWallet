spring:
  application:
    name: multicurrency-wallet

wallet:
  cnb:
    base-url: https://api.cnb.cz
    connect-timeout: 2s
    read-timeout: 3s
    # a failed call is retried 4 times, after 2, 4, 8 and 16 s
    retry-delay: 2s
    # how often the background refresh checks whether a newer fixing can exist (and then calls CNB)
    refresh-interval: 10m
  api-docs:
    server-url: http://localhost:8080
    server-description: Local (./mvnw spring-boot:run or Docker)

management:
  endpoint:
    health:
      # the cnb component shows the fixing date and whether the last refresh failed
      show-details: always
